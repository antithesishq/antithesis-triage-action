name: Antithesis Triage
description: Triage Antithesis test runs with a headless Claude Code agent and publish a report plus the session transcript.
author: Antithesis

branding:
  icon: search
  color: purple

inputs:
  runs:
    description: Natural-language description of which runs to triage.
    required: false
    default: Completed and incomplete runs from the last 7 days for this repository.
  since:
    description: Optional hint, e.g. "7d". Only consider runs created in this window.
    required: false
    default: ''
  limit:
    description: Optional hint. Only triage the last N matching runs.
    required: false
    default: ''
  run-ids:
    description: Optional explicit run IDs (newline or comma separated). Overrides the other selection inputs.
    required: false
    default: ''
  run-params:
    description: Optional key=value lines matched against run parameters, e.g. "antithesis.source=main".
    required: false
    default: ''
  grouping:
    description: Natural-language guidance on which runs are comparable. If empty, the agent infers a grouping and reports it.
    required: false
    default: ''
  known-issues:
    description: One entry per line, a property name or failure description plus an optional note/link. Light check only; flagged if it diverges or stops occurring.
    required: false
    default: ''
  ignore:
    description: One entry per line, properties or failures to skip entirely. Only counted in the report.
    required: false
    default: ''
  instructions:
    description: Free-form extra guidance for the agent.
    required: false
    default: ''
  model:
    description: Claude model for the agent session.
    required: false
    default: claude-opus-5-5
  max-turns:
    description: Maximum agent turns.
    required: false
    default: '200'
  max-budget-usd:
    description: Maximum spend on model API calls for the session.
    required: false
    default: '10'
  timeout-minutes:
    description: Wall-clock limit for the agent session.
    required: false
    default: '60'
  upload-transcript:
    description: '"auto" (off on public repos, on for private), "true", or "false".'
    required: false
    default: auto
  retention-days:
    description: Artifact retention in days.
    required: false
    default: '14'
  artifact-name:
    description: Artifact name. Set a unique name per matrix job or per invocation if the action runs more than once in a workflow run.
    required: false
    default: antithesis-triage-${{ github.job }}-${{ github.run_attempt }}
  github-token:
    description: Token used only to read repository visibility (for upload-transcript auto). Needs no write scopes.
    required: false
    default: ${{ github.token }}
  claude-code-version:
    description: Claude Code CLI version to install.
    required: false
    default: 2.1.312
  snouty-version:
    description: snouty release to install (>= 0.8.0).
    required: false
    default: 0.8.0
  skills-ref:
    description: antithesishq/antithesis-skills commit to load the triage skill from.
    required: false
    default: ca4b8fba0991dbaf4b1b57bea9a4b9605725025f

outputs:
  status:
    description: Final findings status (complete, partial, failed).
    value: ${{ steps.finalize.outputs.status }}
  report-path:
    description: Path to report.md on the runner.
    value: ${{ steps.finalize.outputs.report-path }}
  findings-path:
    description: Path to findings.json on the runner.
    value: ${{ steps.finalize.outputs.findings-path }}
  artifact-url:
    description: URL of the uploaded artifact.
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Check triggering event
      shell: bash
      env:
        ATT_ACTION_PATH: ${{ github.action_path }}
        ATT_EVENT_NAME: ${{ github.event_name }}
      run: '"$ATT_ACTION_PATH/scripts/check-event.sh"'

    - name: Install snouty, Claude Code and the triage skill
      shell: bash
      env:
        ATT_ACTION_PATH: ${{ github.action_path }}
        ATT_ACTION_REF: ${{ github.action_ref }}
        ATT_CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        ATT_SNOUTY_VERSION: ${{ inputs.snouty-version }}
        ATT_SKILLS_REF: ${{ inputs.skills-ref }}
      run: '"$ATT_ACTION_PATH/scripts/install.sh"'

    - name: Preflight
      shell: bash
      env:
        ATT_ACTION_PATH: ${{ github.action_path }}
      run: '"$ATT_ACTION_PATH/scripts/preflight.sh"'

    - name: Render prompt
      shell: bash
      env:
        ATT_ACTION_PATH: ${{ github.action_path }}
        ATT_IN_RUNS: ${{ inputs.runs }}
        ATT_IN_SINCE: ${{ inputs.since }}
        ATT_IN_LIMIT: ${{ inputs.limit }}
        ATT_IN_RUN_IDS: ${{ inputs.run-ids }}
        ATT_IN_RUN_PARAMS: ${{ inputs.run-params }}
        ATT_IN_GROUPING: ${{ inputs.grouping }}
        ATT_IN_KNOWN_ISSUES: ${{ inputs.known-issues }}
        ATT_IN_IGNORE: ${{ inputs.ignore }}
        ATT_IN_INSTRUCTIONS: ${{ inputs.instructions }}
      run: '"$ATT_ACTION_PATH/scripts/render-prompt.sh"'

    - name: Run triage agent
      id: agent
      shell: bash
      env:
        ATT_ACTION_PATH: ${{ github.action_path }}
        ATT_MODEL: ${{ inputs.model }}
        ATT_MAX_TURNS: ${{ inputs.max-turns }}
        ATT_MAX_BUDGET_USD: ${{ inputs.max-budget-usd }}
        ATT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: '"$ATT_ACTION_PATH/scripts/run-agent.sh"'

    - name: Finalize report
      id: finalize
      if: always()
      shell: bash
      env:
        ATT_ACTION_PATH: ${{ github.action_path }}
        ATT_UPLOAD_TRANSCRIPT: ${{ inputs.upload-transcript }}
        ATT_GITHUB_TOKEN: ${{ inputs.github-token }}
        ATT_AGENT_OUTCOME: ${{ steps.agent.outcome }}
        ATT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ATT_EVENT_NAME: ${{ github.event_name }}
      run: '"$ATT_ACTION_PATH/scripts/finalize.sh"'

    # Only upload once finalize has redacted everything in the output dir.
    - name: Upload artifact
      id: upload
      if: always() && steps.finalize.outputs.redacted == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/antithesis-triage/out
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: warn
